<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tetris Tradicional</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #eee;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  #app {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 16px;
    width: 100%; max-width: 360px;
  }
  h1 {
    font-size: 22px; font-weight: 600; margin: 0; letter-spacing: 1px;
  }
  #stats {
    display: flex; gap: 18px; width: 100%; max-width: 300px; justify-content: space-between;
  }
  .stat { font-size: 12px; color: #999; text-align: center; }
  .stat span { display: block; font-size: 20px; font-weight: 600; color: #fff; margin-top: 2px; }
  #board-wrap { position: relative; }
  canvas {
    background: #111;
    border: 2px solid #333;
    border-radius: 8px;
    display: block;
  }
  #overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.8);
    border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
  }
  #overlay h2 { margin: 0; font-size: 20px; }
  #overlay p { margin: 0; font-size: 13px; color: #aaa; max-width: 220px; line-height: 1.5; }
  button {
    background: #fff; color: #111; border: none;
    padding: 10px 22px; border-radius: 8px;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  .ghost-btn {
    background: transparent; color: #eee; border: 1px solid #555;
  }
  #controls {
    display: flex; gap: 8px;
  }
  #controls button {
    background: #2a2a2a; color: #eee; border: 1px solid #444;
    min-width: 64px; padding: 10px; font-size: 18px;
  }
  #dpad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 46px);
    gap: 6px;
  }
  #dpad button {
    background: #2a2a2a; color: #eee; border: 1px solid #444;
    font-size: 20px; border-radius: 8px;
  }
  #dpad .empty { visibility: hidden; }
  #hint { font-size: 11px; color: #666; text-align: center; margin: 0; }
</style>
</head>
<body>
<div id="app">
  <h1>TETRIS</h1>
  <div id="stats">
    <div class="stat">PONTOS<span id="score">0</span></div>
    <div class="stat">NÍVEL<span id="level">1</span></div>
    <div class="stat">LINHAS<span id="lines">0</span></div>
  </div>

  <div id="board-wrap">
    <canvas id="board"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">TETRIS</h2>
      <p id="overlay-text">Encaixe as peças e complete linhas. Use as setas ou os botões abaixo.</p>
      <button id="main-btn">Iniciar</button>
    </div>
  </div>

  <div id="controls">
    <button id="pause-btn" title="Pausar">⏸</button>
    <button id="rotate-btn" title="Girar">⟳</button>
    <button id="hard-btn" title="Queda rápida">⇓</button>
    <button id="new-btn" class="ghost-btn" title="Novo jogo">Novo jogo</button>
  </div>

  <div id="dpad">
    <div class="empty"></div>
    <button id="up-btn" aria-label="Girar">▲</button>
    <div class="empty"></div>
    <button id="left-btn" aria-label="Esquerda">◀</button>
    <button id="down-btn" aria-label="Descer">▼</button>
    <button id="right-btn" aria-label="Direita">▶</button>
  </div>

  <p id="hint">Teclado: setas para mover/girar · espaço para queda rápida · P para pausar</p>
</div>

<script>
(function(){
  const COLS = 10, ROWS = 20, CELL = 24;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  canvas.width = COLS * CELL;
  canvas.height = ROWS * CELL;

  const colors = {
    I: '#31C7EF', O: '#F7D308', T: '#AD4D9C',
    S: '#42B642', Z: '#EF2029', J: '#5A65AD', L: '#EF7921'
  };

  const SHAPES = {
    I: [[1,1,1,1]],
    O: [[1,1],[1,1]],
    T: [[0,1,0],[1,1,1]],
    S: [[0,1,1],[1,1,0]],
    Z: [[1,1,0],[0,1,1]],
    J: [[1,0,0],[1,1,1]],
    L: [[0,0,1],[1,1,1]]
  };

  let board, current, score, level, lines, gameOver, paused, started;
  let dropCounter, dropInterval, lastTime, rafId;

  function newPiece(){
    const keys = Object.keys(SHAPES);
    const type = keys[Math.floor(Math.random()*keys.length)];
    const shape = SHAPES[type].map(r=>r.slice());
    return { type, shape, x: Math.floor(COLS/2) - Math.ceil(shape[0].length/2), y: 0 };
  }

  function createBoard(){
    return Array.from({length:ROWS}, ()=>Array(COLS).fill(0));
  }

  function collide(piece, offX, offY, shape){
    const s = shape || piece.shape;
    for(let y=0;y<s.length;y++){
      for(let x=0;x<s[y].length;x++){
        if(!s[y][x]) continue;
        const nx = piece.x + x + offX;
        const ny = piece.y + y + offY;
        if(nx < 0 || nx >= COLS || ny >= ROWS) return true;
        if(ny >= 0 && board[ny][nx]) return true;
      }
    }
    return false;
  }

  function merge(){
    current.shape.forEach((row,y)=>{
      row.forEach((val,x)=>{
        if(val){
          const ny = current.y + y, nx = current.x + x;
          if(ny >= 0) board[ny][nx] = current.type;
        }
      });
    });
  }

  function rotateShape(shape){
    const rows = shape.length, cols = shape[0].length;
    const result = Array.from({length:cols}, ()=>Array(rows).fill(0));
    for(let y=0;y<rows;y++) for(let x=0;x<cols;x++) result[x][rows-1-y] = shape[y][x];
    return result;
  }

  function tryRotate(){
    if(!started || gameOver || paused) return;
    const rotated = rotateShape(current.shape);
    const kicks = [0,-1,1,-2,2];
    for(const k of kicks){
      if(!collide(current, k, 0, rotated)){
        current.shape = rotated;
        current.x += k;
        return;
      }
    }
  }

  function clearLines(){
    let cleared = 0;
    outer: for(let y=ROWS-1;y>=0;y--){
      for(let x=0;x<COLS;x++) if(!board[y][x]) continue outer;
      board.splice(y,1);
      board.unshift(Array(COLS).fill(0));
      cleared++;
      y++;
    }
    if(cleared>0){
      const points = [0,100,300,500,800][cleared] * level;
      score += points;
      lines += cleared;
      level = Math.floor(lines/10) + 1;
      dropInterval = Math.max(100, 1000 - (level-1)*80);
      updateStats();
    }
  }

  function updateStats(){
    document.getElementById('score').textContent = score;
    document.getElementById('level').textContent = level;
    document.getElementById('lines').textContent = lines;
  }

  function pieceDrop(){
    if(!collide(current,0,1)){
      current.y++;
    } else {
      merge();
      clearLines();
      current = newPiece();
      if(collide(current,0,0)) endGame();
    }
    dropCounter = 0;
  }

  function hardDrop(){
    if(!started || gameOver || paused) return;
    while(!collide(current,0,1)) current.y++;
    pieceDrop();
    draw();
  }

  function move(dir){
    if(!started || gameOver || paused) return;
    if(!collide(current,dir,0)) current.x += dir;
    draw();
  }

  function softDrop(){
    if(!started || gameOver || paused) return;
    pieceDrop();
    draw();
  }

  function endGame(){
    gameOver = true;
    started = false;
    showOverlay('Fim de jogo', 'Pontuação final: ' + score, 'Novo jogo');
    cancelAnimationFrame(rafId);
  }

  function togglePause(){
    if(!started || gameOver) return;
    paused = !paused;
    if(paused){
      showOverlay('Pausado', 'Toque em continuar para retomar.', 'Continuar');
      cancelAnimationFrame(rafId);
    } else {
      hideOverlay();
      lastTime = performance.now();
      rafId = requestAnimationFrame(update);
    }
  }

  function showOverlay(title, text, btnLabel){
    document.getElementById('overlay-title').textContent = title;
    document.getElementById('overlay-text').textContent = text;
    document.getElementById('main-btn').textContent = btnLabel;
    document.getElementById('overlay').style.display = 'flex';
  }
  function hideOverlay(){
    document.getElementById('overlay').style.display = 'none';
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    for(let x=0;x<=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,ROWS*CELL); ctx.stroke(); }
    for(let y=0;y<=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(COLS*CELL,y*CELL); ctx.stroke(); }

    board.forEach((row,y)=>{
      row.forEach((val,x)=>{
        if(val){
          ctx.fillStyle = colors[val];
          ctx.fillRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2);
        }
      });
    });

    if(current){
      ctx.fillStyle = colors[current.type];
      current.shape.forEach((row,y)=>{
        row.forEach((val,x)=>{
          if(val){
            const px = (current.x+x)*CELL, py = (current.y+y)*CELL;
            if(py >= 0) ctx.fillRect(px+1,py+1,CELL-2,CELL-2);
          }
        });
      });
    }
  }

  function update(time){
    if(!started || gameOver || paused) return;
    const delta = time - lastTime;
    lastTime = time;
    dropCounter += delta;
    if(dropCounter > dropInterval) pieceDrop();
    draw();
    rafId = requestAnimationFrame(update);
  }

  function resetState(){
    board = createBoard();
    current = newPiece();
    score = 0; level = 1; lines = 0;
    gameOver = false; paused = false;
    dropCounter = 0; dropInterval = 1000;
    updateStats();
    draw();
  }

  function startGame(){
    resetState();
    started = true;
    hideOverlay();
    lastTime = performance.now();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(update);
  }

  // Botão principal do overlay: serve tanto para "Iniciar" quanto "Continuar" quanto "Novo jogo"
  document.getElementById('main-btn').addEventListener('click', ()=>{
    if(paused && started){ togglePause(); return; }
    startGame();
  });
  document.getElementById('new-btn').addEventListener('click', startGame);

  document.getElementById('left-btn').addEventListener('click', ()=>move(-1));
  document.getElementById('right-btn').addEventListener('click', ()=>move(1));
  document.getElementById('down-btn').addEventListener('click', softDrop);
  document.getElementById('up-btn').addEventListener('click', tryRotate);
  document.getElementById('rotate-btn').addEventListener('click', tryRotate);
  document.getElementById('hard-btn').addEventListener('click', hardDrop);
  document.getElementById('pause-btn').addEventListener('click', togglePause);

  document.addEventListener('keydown', (e)=>{
    if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key)) e.preventDefault();
    if(e.key==='ArrowLeft') move(-1);
    else if(e.key==='ArrowRight') move(1);
    else if(e.key==='ArrowDown') softDrop();
    else if(e.key==='ArrowUp') tryRotate();
    else if(e.key===' ') hardDrop();
    else if(e.key==='p' || e.key==='P') togglePause();
  }, {passive:false});

  // Estado inicial: tabuleiro vazio visível atrás do overlay "Iniciar"
  board = createBoard();
  current = newPiece();
  draw();
})();
</script>
</body>
</html>
